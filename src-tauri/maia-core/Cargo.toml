[package]
name = "maia-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "In-process Maia-3 UCI engine (Rust + ONNX Runtime)"

[lib]
name = "maia_core"
path = "src/lib.rs"

[[bin]]
name = "maia-uci"
path = "src/bin/maia_uci.rs"

[dependencies]
chess = "3.2"
serde_json = "1"
# load-dynamic keeps the build offline; the app supplies libonnxruntime at run time
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
