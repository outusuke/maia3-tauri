[package]
name = "maia-chess"
version = "0.1.0"
description = "A simple Lichess-style chess GUI that plays against the Maia-3 human-like engine"
license = "GPL-3.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
maia-core = { path = "maia-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chess = "3.2"

[target.'cfg(target_os = "android")'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
libloading = "0.8"

[lib]
name = "maia_chess_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maia-chess"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

# "s" is fine for the UI but slows the model maths
[profile.release.package.maia-core]
opt-level = 3
