app-id: dev.maiachess.MaiaChess
# GNOME runtime rather than freedesktop because it ships WebKitGTK, which Tauri needs.
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: maia-chess

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/maia-chess/cargo-home

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # plain cargo build skips the Tauri bundler, so bundled.rs looks here for the models, ONNX Runtime and Stockfish
  - --env=MAIA3_RESOURCES_DIR=/app/lib/maia-chess/resources

modules:
  - name: maia-chess-gui
    buildsystem: simple
    build-options:
      build-args:
        - --share=network # cargo fetches crates.io deps
    build-commands:
      - cargo build --release --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/maia-chess /app/bin/maia-chess
      - install -Dm644 src-tauri/icons/icon.png
          /app/share/icons/hicolor/512x512/apps/dev.maiachess.MaiaChess.png
      - install -Dm644 dev.maiachess.MaiaChess.desktop
          /app/share/applications/dev.maiachess.MaiaChess.desktop
      - install -Dm644 dev.maiachess.MaiaChess.metainfo.xml
          /app/share/metainfo/dev.maiachess.MaiaChess.metainfo.xml
      - install -Dm644 -t /app/lib/maia-chess/resources/models src-tauri/resources/models/*.onnx
      - install -Dm755 -t /app/lib/maia-chess/resources/ort src-tauri/resources/ort/libonnxruntime.so*
      - install -Dm755 -t /app/lib/maia-chess/resources/stockfish src-tauri/resources/stockfish/stockfish
    sources:
      - type: dir
        path: .
