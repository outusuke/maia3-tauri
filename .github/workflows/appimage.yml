name: AppImage
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to bundle (space-separated ids from the models release)"
        default: "maia3-23m"
  release:
    types: [published]
jobs:
  build-appimage:
    name: "Build AppImage"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Fetch ONNX Runtime, Stockfish and the Maia models
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS: ${{ inputs.models || 'maia3-23m' }}
        run: python3 scripts/fetch_assets.py

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: cargo tauri build --bundles appimage

      - name: Rename AppImage
        run: |
          f=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          mv "$f" src-tauri/target/release/bundle/appimage/maia3-tauri.AppImage
          chmod +x src-tauri/target/release/bundle/appimage/maia3-tauri.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: src-tauri/target/release/bundle/appimage/maia3-tauri.AppImage

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: src-tauri/target/release/bundle/appimage/maia3-tauri.AppImage
