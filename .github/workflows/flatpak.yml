name: Flatpak
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to bundle (space-separated ids from the models release)"
        default: "maia3-23m"
  release:
    types: [published]
jobs:
  assets:
    name: "Fetch bundled assets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch ONNX Runtime, Stockfish and the Maia models
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS: ${{ inputs.models || 'maia3-23m' }}
        run: python3 scripts/fetch_assets.py
      - uses: actions/upload-artifact@v7
        with:
          name: bundled-assets
          path: |
            src-tauri/resources/models/*.onnx
            src-tauri/resources/ort/*
            src-tauri/resources/stockfish/*
  build:
    needs: assets
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bundled-assets
          path: src-tauri/resources
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: maia3-tauri.flatpak
          manifest-path: dev.maiachess.MaiaChess.yml
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: maia3-tauri.flatpak
  release:
    name: "Publish Release"
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: flatpak-bundle
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: maia3-tauri.flatpak
          generate_release_notes: true
          body: |
            Flatpak bundle for maia3-tauri

            **First install:**
            ```bash
            flatpak install --user maia3-tauri.flatpak
            flatpak run dev.maiachess.MaiaChess
            ```

            **Already installed? Update to this version:**
            ```bash
            flatpak install --user --reinstall maia3-tauri.flatpak
            ```
