name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  check:
    name: cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/maia-core

      # Tauri's Linux deps; the check fails at the webkit/gtk build scripts without them
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check the desktop app
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test the desktop app
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test maia-core
        run: cargo test --locked --manifest-path src-tauri/maia-core/Cargo.toml
