name: CI
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  release:
    types: [published]
jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: maia3-tauri.flatpak
          manifest-path: dev.maiachess.MaiaChess.yml
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: maia3-tauri.flatpak
  release:
    name: "Publish Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: maia3-tauri.flatpak
          generate_release_notes: true
          body: |
            Flatpak bundle for maia3-tauri

            **First install:**
            ```bash
            flatpak install --user maia3-tauri.flatpak
            flatpak run dev.maiachess.MaiaChess
            ```

            **Already installed? Update to this version:**
            ```bash
            flatpak install --user --reinstall maia3-tauri.flatpak
            ```
