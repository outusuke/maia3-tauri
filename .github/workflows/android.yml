name: Android

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to bundle into the APK (space-separated ids, must exist in the models release)"
        default: "maia3-23m"
      skip_tests:
        description: "Skip the maia-core tests"
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  maia-core:
    name: maia-core tests
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/maia-core
      - run: cargo test --manifest-path src-tauri/maia-core/Cargo.toml

  apk:
    name: Build APK (arm64)
    needs: maia-core
    if: ${{ !cancelled() && needs.maia-core.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: "30.0.16248370"
      MODELS: ${{ inputs.models || 'maia3-23m' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;${{ env.NDK_VERSION }}"

      - name: Point the build at the NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Built as a shared library, not an executable, so it loads in-process straight from the APK
      - name: Build Stockfish for Android (arm64)
        env:
          MULTISTOCKFISH_REF: fd8dcea4fcbfd2ae936b409f8f329dded5d80a71
        run: |
          git clone https://github.com/lichess-org/dart-multistockfish.git msf
          git -C msf checkout "$MULTISTOCKFISH_REF"
          cmake -S msf/pkgs/multistockfish_light/android -B sf-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build sf-build --parallel
          file sf-build/libmultistockfish_light.so
          cp sf-build/libmultistockfish_light.so "$GITHUB_WORKSPACE/"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate the Android project
        run: cargo tauri android init --ci

      - name: Fetch the Maia models from the models release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for m in $MODELS; do
            gh release download models --pattern "$m.onnx" --dir bundled-models
          done
          ls -lh bundled-models

      # ort only needs ONNX Runtime >= 1.17; this just tracks the newest AAR on Maven Central
      - name: Fetch ONNX Runtime for Android
        env:
          ORT_VERSION: "1.30.0"
        run: |
          curl -fsSL -o ort.aar "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_VERSION}/onnxruntime-android-${ORT_VERSION}.aar"
          unzip -o -j ort.aar jni/arm64-v8a/libonnxruntime.so -d ort-lib
          ls -lh ort-lib

      - name: Package Stockfish, ONNX Runtime and the Maia models into the APK
        run: |
          ARGS=""
          for f in bundled-models/*.onnx; do ARGS="$ARGS --model $f"; done
          python3 scripts/patch_android.py libmultistockfish_light.so arm64-v8a --ort ort-lib/libonnxruntime.so $ARGS

      - name: Build release APK
        run: cargo tauri android build --apk --target aarch64

      # unsigned APKs won't install; without secrets this uses a throwaway key (updates across keys are refused)
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          UNSIGNED=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          echo "unsigned: $UNSIGNED"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            PASS=android-test-key; ALIAS=test
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Maia Chess test"
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" sign --ks release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --out maia-chess-arm64.apk "$UNSIGNED"
          "$APKSIGNER" verify maia-chess-arm64.apk
          rm -f release.jks

      - name: Check the libraries and uncompressed models made it into the APK
        run: |
          unzip -l maia-chess-arm64.apk | grep -E 'lib/arm64-v8a/(libmultistockfish_light|libonnxruntime|libmaia_chess_lib)\.so'
          for m in $MODELS; do
            unzip -v maia-chess-arm64.apk "assets/models/$m.onnx" | grep Stored
          done

      - uses: actions/upload-artifact@v7
        with:
          name: maia-chess-android
          path: maia-chess-arm64.apk

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: maia-chess-arm64.apk
