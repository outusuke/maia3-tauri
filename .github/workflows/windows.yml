name: Windows
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to bundle (space-separated ids from the models release)"
        default: "maia3-23m"
  release:
    types: [published]
jobs:
  build-windows:
    name: "Build Windows installer"
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Apply VERSION
        shell: pwsh
        run: python scripts/set_version.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch ONNX Runtime, Stockfish and the Maia models
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS: ${{ inputs.models || 'maia3-23m' }}
        run: python scripts/fetch_assets.py
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        run: cargo tauri build --bundles nsis
      - name: Rename installer (drop version from filename)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Move-Item $exe.FullName "src-tauri/target/release/bundle/nsis/maia3-tauri-setup.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/maia3-tauri-setup.exe
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: src-tauri/target/release/bundle/nsis/maia3-tauri-setup.exe
